<!doctype html>
<html lang="zh-CN">
<head>

  <title>王冉冉｜个人作品集</title>
  <style>
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#190b3d;font-family:"PingFang SC","Microsoft YaHei",sans-serif}.deck{position:relative;width:100vw;height:100vh;overflow:hidden;background:#190b3d}.page{position:absolute;inset:0;display:none;place-items:center;background:#190b3d}.page.active{display:grid}.art{display:block;width:100%;height:100%;object-fit:contain}.cover-person{position:absolute;z-index:1;left:22.5%;bottom:-1%;width:48%;height:auto;pointer-events:none;transform:translate3d(var(--person-x,0),var(--person-y,0),0) rotate(var(--person-tilt,0deg));transform-origin:53% 82%;transition:transform .18s ease-out;will-change:transform}.loading-person{position:absolute;z-index:1;top:9%;right:-1%;width:49%;height:auto;pointer-events:none;transform:translate3d(var(--loading-x,0),var(--loading-y,0),0) rotate(var(--loading-tilt,0deg));transform-origin:67% 70%;transition:transform .18s ease-out;will-change:transform}.loading-progress{position:absolute;z-index:2;left:12.4%;top:58.6%;width:34%;height:5%;padding:3px;border:3px solid #30205f;border-radius:5px;background:#fff3d6;transform:rotate(-8.4deg);box-shadow:4px 4px 0 #00cdd0,-3px -3px 0 #f2389d}.loading-progress i{display:block;position:relative;width:0;height:100%;overflow:hidden;background:#f2389d;transition:width .16s linear}.loading-progress i:after{content:"/////  /////  /////  /////";position:absolute;inset:-.3em 0 0 .25em;color:#fff7c9;font-size:clamp(12px,1.5vw,23px);font-weight:900;letter-spacing:.13em;white-space:nowrap}.loading-progress b{position:absolute;right:-15%;top:-.45em;color:#30205f;font-size:clamp(11px,1.1vw,17px);font-weight:900;letter-spacing:.04em;text-shadow:1px 1px 0 #00cdd0}.next,.prev{position:absolute;z-index:3;bottom:3%;border:2px solid #fff;border-radius:999px;padding:.6em 1.15em;background:#6c5e94;color:#fff;font-size:clamp(13px,1.3vw,18px);font-weight:700;cursor:pointer;box-shadow:0 3px 10px #16072f80}.next{right:2.8%}.prev{left:2.8%}.next:hover,.prev:hover{background:#e8349a}.dots{position:absolute;z-index:4;right:3%;bottom:2%;display:flex;gap:7px}.dots button{width:13px;height:13px;padding:0;border:2px solid #fff;border-radius:50%;background:#735f9f;cursor:pointer}.dots button.on{background:#fff}.page[data-page="3"] .next{bottom:2.8%;right:3%}.map{position:absolute;z-index:2;top:49%;height:31%;width:17%;border:0;background:transparent;cursor:pointer}.map:focus-visible,.next:focus-visible,.prev:focus-visible,.dots button:focus-visible{outline:4px solid #00e7df;outline-offset:3px}.map.one{left:13%}.map.two{left:32%}.map.three{left:51%}.map.four{left:70%}@media (max-aspect-ratio:1/1){.art{width:100%;height:auto}.next{bottom:4%;right:4%}.prev{bottom:4%;left:4%}}
    /* Keep every layer inside one 16:9 stage so resize never separates art and overlays. */
    body{display:grid;place-items:center}
    .deck{width:min(100vw,177.58vh);height:min(100vh,56.31vw);aspect-ratio:1671/941}
    .art{width:100%;height:100%;object-fit:cover}
    .page[data-page="0"] .next{top:4%;right:3%;bottom:auto}
    .about-photo{position:absolute;z-index:1;left:5.4%;top:31.5%;width:18%;height:42%;padding:.55%;border:4px solid #fa4f8b;border-radius:4px;background:#fff7eb;object-fit:cover;box-shadow:4px 4px 0 #00d5d7,0 10px 22px #41135645;pointer-events:none;transform:translate3d(var(--about-x,0),var(--about-y,0) ,0) rotate(var(--about-tilt,0deg));transform-origin:center;transition:transform .2s ease-out;will-change:transform}.about-tagline{position:absolute;z-index:2;top:20.5%;left:46%;width:47%;margin:0;color:#5d1879;font-size:clamp(12px,1.35vw,22px);font-weight:900;line-height:1.25;letter-spacing:.045em;text-shadow:0 1px 0 #fff5e2}.about-copy{position:absolute;z-index:2;left:29%;top:30%;width:65%;color:#351060;text-shadow:0 1px 0 #fff5e2}.about-intro{margin:0 0:1.3%;font-size:clamp(8px,.78vw,13px);font-weight:650;line-height:1.42;letter-spacing:.015em}.about-intro p{margin:0 0:.34em}.skills-title{margin:0 0:1%;font-size:clamp(12px,1.15vw,19px);font-weight:900;letter-spacing:.06em;color:#391060}.skill-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.2% 2%}.skill-card{min-height:clamp(42px,10.5vh,100px);padding:3% 5%;border:2px solid #5a1685;border-radius:3px;background:#fff9e9dc;box-shadow:3px 3px 0 #00ced0}.skill-card h3{margin:0 0:.28em;color:#60178e;font-size:clamp(10px,1vw,17px);font-weight:900}.skill-card p{margin:0;color:#4a266f;font-size:clamp(7px,.72vw,12px);font-weight:700;line-height:1.3}.about-stats{position:absolute;z-index:2;left:29%;right:5.5%;bottom:6.7%;display:grid;grid-template-columns:repeat(5,1fr);gap:1%;color:#4b126b;text-align:center}.about-stat{font-size:clamp(7px,.67vw,11px);font-weight:800;line-height:1.25}.about-stat strong{display:block;color:#e62994;font-size:clamp(12px,1.25vw,21px);font-weight:950;letter-spacing:.02em}@media (max-aspect-ratio:1/1){.about-tagline{left:45%;top:20%;width:49%}.about-copy{left:28%;top:29%;width:67%}.about-stats{left:28%;right:4%;bottom:7%}.skill-card{padding:3%}.about-photo{border-width:2px}}
    .plan-poses{position:absolute;z-index:1;top:10%;left:4%;width:27%;height:76%;pointer-events:none}.plan-pose{position:absolute;inset:0;margin:auto;display:block;max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;object-position:left top;opacity:0;animation:plan-pose-cycle 4s steps(1,end) infinite}.plan-pose.pose-1{animation-delay:0s}.plan-pose.pose-2{animation-delay:-1s}.plan-pose.pose-3{animation-delay:-2s}.plan-pose.pose-4{animation-delay:-3s}@keyframes plan-pose-cycle{0%,24.99%{opacity:1}25%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){.plan-pose{animation:none}.plan-pose:not(.pose-1){display:none}}.topify-gallery,.qindian-gallery,.sohu-gallery{position:absolute;z-index:2;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scroll-behavior:smooth;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#e832a6 #fff4df;touch-action:pan-y}.topify-gallery{top:7%;right:2.8%;bottom:6.8%;left:20.5%;border-radius:18px}.qindian-gallery{top:12%;right:25%;bottom:8%;left:3%;border-radius:18px}.sohu-gallery{top:12%;right:3%;bottom:8%;left:20.5%;border-radius:18px}.topify-gallery::-webkit-scrollbar,.qindian-gallery::-webkit-scrollbar,.sohu-gallery::-webkit-scrollbar{width:8px}.topify-gallery::-webkit-scrollbar-thumb,.qindian-gallery::-webkit-scrollbar-thumb,.sohu-gallery::-webkit-scrollbar-thumb{border-radius:99px;background:#e832a6}.topify-gallery::-webkit-scrollbar-track,.qindian-gallery::-webkit-scrollbar-track,.sohu-gallery::-webkit-scrollbar-track{border-radius:99px;background:#fff4df}.topify-slide,.qindian-slide,.sohu-slide{position:relative;display:grid;width:100%;height:100%;min-height:100%;margin:0;place-items:center;scroll-snap-align:start;scroll-snap-stop:always}.topify-slide img,.qindian-slide img,.sohu-slide img{display:block;max-width:100%;max-height:100%;width:100%;height:auto;border-radius:12px;box-shadow:0 8px 24px #30105724}.topify-hotspot{position:absolute;z-index:3;border:0;background:transparent;cursor:pointer}.topify-hotspot:focus-visible,.topify-return:focus-visible{outline:4px solid #00e7df;outline-offset:3px}.topify-action-1{left:2%;top:74%;width:24%;height:11%}.topify-action-2{left:27.5%;top:74%;width:23%;height:11%}.topify-action-3{left:51.5%;top:74%;width:23%;height:11%}.topify-action-4{left:75%;top:74%;width:23%;height:11%}.topify-showcase{left:78%;top:12%;width:21%;height:79%}.topify-detail{position:absolute;z-index:5;top:7%;right:2.8%;bottom:6.8%;left:20.5%;display:grid;place-items:center;border-radius:18px;background:#fff8eb;box-shadow:0 12px 28px #26093d55}.topify-detail[hidden]{display:none}.topify-detail img{display:block;max-width:100%;max-height:100%;width:100%;height:auto;border-radius:12px}.topify-return{position:absolute;z-index:1;left:2%;bottom:2%;border:2px solid #fff;border-radius:999px;padding:.5em 1em;background:#6c5e94;color:#fff;font-size:clamp(11px,1vw,16px);font-weight:800;cursor:pointer;box-shadow:0 3px 10px #16072f80}@media (max-aspect-ratio:1/1){.topify-gallery,.topify-detail{left:20%;right:2%;top:7%;bottom:7%;border-radius:9px}.qindian-gallery{left:3%;right:25%;top:12%;bottom:7%;border-radius:9px}.sohu-gallery{left:20%;right:2%;top:12%;bottom:7%;border-radius:9px}.topify-gallery::-webkit-scrollbar,.qindian-gallery::-webkit-scrollbar,.sohu-gallery::-webkit-scrollbar{width:5px}}
  </style>
</head>
<body>
  <main class="deck" aria-label="王冉冉个人作品集">
    <section class="page active cover" data-page="0"><img class="art" src="assets/original/cover-background.png" alt="王冉冉个人作品集封面" /><img class="cover-person" src="assets/generated/cover-character-transparent.png" alt="" aria-hidden="true" /></section>
    <section class="page loading" data-page="1"><img class="art" src="assets/original/loading-background.png" alt="加载中" /><img class="loading-person" src="assets/generated/loading-character-transparent.png" alt="" aria-hidden="true" /><div class="loading-progress" role="progressbar" aria-label="作品集加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i><b>0%</b></div></section>
    <section class="page" data-page="2"><img class="art" src="assets/original/about.png" alt="个人简介" /></section>
    <section class="page" data-page="3"><img class="art" src="assets/original/about-detail-background.png" alt="自我介绍详情" /><img class="about-photo" src="assets/original/profile-photo.jpg" alt="王冉冉证件照" /></section>
    <section class="page" data-page="4"><img class="art" src="assets/original/experience.png" alt="实习工作经历介绍" /><button class="map one" data-go="5" aria-label="查看 Topify.ai"></button><button class="map two" data-go="6" aria-label="查看北京秦点"></button><button class="map three" data-go="7" aria-label="查看搜狐"></button><button class="map four" data-go="8" aria-label="查看重庆大师兄"></button></section>
    <section class="page" data-page="5"><img class="art" src="assets/original/topify.png" alt="Topify.ai 模板" /><div class="topify-gallery" tabindex="0" aria-label="Topify.ai 项目图片展示区"><figure class="topify-slide"><img src="assets/topify/01-overview.png" alt="Topify.ai 项目总览" /></figure><figure class="topify-slide"><img src="assets/topify/02-pain-points.png" alt="业务背景与问题诊断" /></figure><figure class="topify-slide"><img src="assets/topify/03-system.png" alt="AI 运营体系设计与闭环流程" /><button class="topify-hotspot topify-action-1" data-detail="assets/topify/04-knowledge-base.png" aria-label="查看飞书内容知识库"></button><button class="topify-hotspot topify-action-2" data-detail="assets/topify/04-knowledge-base.png" aria-label="查看 AI 图文内容生产"></button><button class="topify-hotspot topify-action-3" data-detail="assets/topify/05-monitoring.png" aria-label="查看账号数据监测与分析"></button><button class="topify-hotspot topify-action-4" data-detail="assets/topify/06-automation.png" aria-label="查看桌面自动化数据处理"></button></figure><figure class="topify-slide"><img src="assets/topify/07-matrix.png" alt="AI 内容矩阵运营数据看板" /><button class="topify-hotspot topify-showcase" data-detail="assets/topify/08-showcase.png" aria-label="查看内容作品展区"></button></figure><figure class="topify-slide"><img src="assets/topify/09-iteration.png" alt="数据监测与策略迭代仪表盘" /></figure><figure class="topify-slide"><img src="assets/topify/10-review.png" alt="阶段成果与项目复盘" /></figure></div><div class="topify-detail" hidden aria-live="polite"><img src="" alt="" /><button class="topify-return" type="button">← 返回展示区</button></div></section>
    <section class="page" data-page="6"><img class="art" src="assets/original/qindian.png" alt="北京秦点模板" /><div class="qindian-gallery" tabindex="0" aria-label="北京秦点项目图片展示区"><figure class="qindian-slide"><img src="assets/qindian/01-overview.png" alt="北京秦点业务背景与成果" /></figure><figure class="qindian-slide"><img src="assets/qindian/02-diagnosis.png" alt="北京秦点业务链路效率瓶颈诊断与 AI 优化" /></figure><figure class="qindian-slide"><img src="assets/qindian/03-workflow.png" alt="北京秦点 AI 内容与广告投放工作流" /></figure><figure class="qindian-slide"><img src="assets/qindian/04-execution.png" alt="北京秦点执行落地 AI 内容生产作品展示" /></figure><figure class="qindian-slide"><img src="assets/qindian/05-iteration.png" alt="北京秦点数据回收与内容优化闭环" /></figure><figure class="qindian-slide"><img src="assets/qindian/06-review.png" alt="北京秦点阶段成果与项目复盘" /></figure></div></section>
    <section class="page" data-page="7"><img class="art" src="assets/original/sohu.png" alt="搜狐模板" /><div class="sohu-gallery" tabindex="0" aria-label="搜狐项目图片展示区"><figure class="sohu-slide"><img src="assets/sohu/01-overview.png" alt="搜狐项目概览与运营职责展示" /></figure><figure class="sohu-slide"><img src="assets/sohu/02-strategy.png" alt="搜狐抖音快手平台差异与内容策略" /></figure><figure class="sohu-slide"><img src="assets/sohu/03-execution.png" alt="搜狐内容策划与执行落地流程展示" /></figure><figure class="sohu-slide"><img src="assets/sohu/04-optimization.png" alt="搜狐数据分析与内容优化" /></figure><figure class="sohu-slide"><img src="assets/sohu/05-review.png" alt="搜狐阶段成果与项目复盘" /></figure></div></section>
    <section class="page" data-page="8"><img class="art" src="assets/original/dashixiong.png" alt="重庆大师兄模板" /></section>
    <section class="page" data-page="9"><img class="art" src="assets/original/planning-background.png" alt="个人规划" /><div class="plan-poses" aria-hidden="true"><img class="plan-pose pose-1" src="assets/generated/planning-pose-1.png" alt="" /><img class="plan-pose pose-2" src="assets/generated/planning-pose-2.png" alt="" /><img class="plan-pose pose-3" src="assets/generated/planning-pose-3.png" alt="" /><img class="plan-pose pose-4" src="assets/generated/planning-pose-4.png" alt="" /></div></section>
    <section class="page" data-page="10"><img class="art" src="assets/original/closing.png" alt="感谢观看" /></section>
    <button class="prev" aria-label="上一页">← 上一页</button>
  </main>
  <script>
    const pages=[...document.querySelectorAll('.page')];let index=0;
    let loadingRun=0;
    function show(next){index=(next+pages.length)%pages.length;pages.forEach((page,i)=>page.classList.toggle('active',i===index));document.querySelector('.prev').disabled=index===0;if(index===1)runLoading();else loadingRun++}
    document.querySelector('.prev').addEventListener('click',()=>{if(index>0)show(index-1)});
    pages.forEach((page,pageIndex)=>page.addEventListener('click',event=>{if(pageIndex!==1&&pageIndex!==4&&!event.target.closest('button')&&!event.target.closest('.topify-gallery,.topify-detail,.qindian-gallery,.sohu-gallery'))show(pageIndex+1)}));
    document.querySelectorAll('[data-go]').forEach(button=>button.addEventListener('click',()=>show(Number(button.dataset.go))));
    const topifyGallery=document.querySelector('.topify-gallery'),topifyDetail=document.querySelector('.topify-detail'),topifyDetailImage=topifyDetail.querySelector('img');
    document.querySelectorAll('[data-detail]').forEach(button=>button.addEventListener('click',event=>{event.stopPropagation();topifyDetailImage.src=button.dataset.detail;topifyDetailImage.alt=button.getAttribute('aria-label');topifyDetail.hidden=false}));
    topifyDetail.querySelector('.topify-return').addEventListener('click',event=>{event.stopPropagation();topifyDetail.hidden=true;topifyGallery.focus({preventScroll:true})});
    const person=document.querySelector('.cover-person');
    document.querySelector('.cover').addEventListener('pointermove',event=>{const rect=event.currentTarget.getBoundingClientRect(),x=(event.clientX-rect.left)/rect.width-.5,y=(event.clientY-rect.top)/rect.height-.5;person.style.setProperty('--person-x',`${x*8}px`);person.style.setProperty('--person-y',`${y*6}px`);person.style.setProperty('--person-tilt',`${x*0.8}deg`)});
    document.querySelector('.cover').addEventListener('pointerleave',()=>{person.style.setProperty('--person-x','0px');person.style.setProperty('--person-y','0px');person.style.setProperty('--person-tilt','0deg')});
    const aboutPhoto=document.querySelector('.about-photo'),aboutPage=document.querySelector('[data-page="3"]');
    aboutPage.addEventListener('pointermove',event=>{const rect=event.currentTarget.getBoundingClientRect(),x=(event.clientX-rect.left)/rect.width-.5,y=(event.clientY-rect.top)/rect.height-.5;aboutPhoto.style.setProperty('--about-x',`${x*6}px`);aboutPhoto.style.setProperty('--about-y',`${y*5}px`);aboutPhoto.style.setProperty('--about-tilt',`${x*.6}deg`)});
    aboutPage.addEventListener('pointerleave',()=>{aboutPhoto.style.setProperty('--about-x','0px');aboutPhoto.style.setProperty('--about-y','0px');aboutPhoto.style.setProperty('--about-tilt','0deg')});
    const loadingPerson=document.querySelector('.loading-person');
    document.querySelector('.loading').addEventListener('pointermove',event=>{const rect=event.currentTarget.getBoundingClientRect(),x=(event.clientX-rect.left)/rect.width-.5,y=(event.clientY-rect.top)/rect.height-.5;loadingPerson.style.setProperty('--loading-x',`${x*7}px`);loadingPerson.style.setProperty('--loading-y',`${y*5}px`);loadingPerson.style.setProperty('--loading-tilt',`${x*.7}deg`)});
    document.querySelector('.loading').addEventListener('pointerleave',()=>{loadingPerson.style.setProperty('--loading-x','0px');loadingPerson.style.setProperty('--loading-y','0px');loadingPerson.style.setProperty('--loading-tilt','0deg')});
    function runLoading(){const run=++loadingRun,bar=document.querySelector('.loading-progress'),fill=bar.querySelector('i'),label=bar.querySelector('b'),sources=[...document.querySelectorAll('.page .art')].slice(2).map(image=>image.src);let done=0;const started=performance.now();const setProgress=value=>{const percent=Math.round(value);fill.style.width=`${percent}%`;label.textContent=`${percent}%`;bar.setAttribute('aria-valuenow',percent)};setProgress(0);const preload=source=>new Promise(resolve=>{const image=new Image();image.onload=image.onerror=()=>{done++;resolve()};image.src=source});Promise.all(sources.map(preload)).then(async()=>{if(run!==loadingRun)return;const wait=Math.max(0,2000-(performance.now()-started));await new Promise(resolve=>setTimeout(resolve,wait));if(run!==loadingRun)return;setProgress(100);setTimeout(()=>{if(run===loadingRun)show(2)},180)});const tick=()=>{if(run!==loadingRun)return;const elapsed=Math.min(94,(performance.now()-started)/1800*94);const resource=sources.length?done/sources.length*94:94;setProgress(Math.max(elapsed,resource));if(done<sources.length)requestAnimationFrame(tick)};requestAnimationFrame(tick)}
    document.addEventListener('keydown',event=>{if(event.key==='ArrowRight'||event.key===' ')show(index+1);if(event.key==='ArrowLeft')show(index-1)});show(0);
  </script>
</body>
</html>
